<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickSlot - Discover the Perfect Meeting Space</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 0;
            background-color: #f4f4f4;
            color: #333;
        }

        .navbar {
            background-color: #0d47a1; /* Dark blue */
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar-brand {
            font-size: 1.5em;
            font-weight: bold;
        }

        .navbar-links ul {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
        }

        .navbar-links li {
            margin-left: 20px;
        }

        .navbar-links a {
            color: white;
            text-decoration: none;
        }

        .hero {
            background: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)), url('hero-image.jpg') center/cover no-repeat;
            color: white;
            text-align: left;
            padding: 100px 20px;
        }

        .hero-content {
            max-width: 800px;
            margin: 0 auto;
        }

        .hero-title {
            font-size: 3em;
            margin-bottom: 20px;
        }

        .hero-subtitle {
            font-size: 1.2em;
            margin-bottom: 30px;
        }

        .cta-button {
            background-color: #1976d2; /* Blue */
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 5px;
            text-decoration: none;
            font-size: 1.1em;
            cursor: pointer;
        }

        .cta-button:hover {
            background-color: #1565c0;
        }

        /* You can add more styles for other sections of your homepage here */
    </style>
</head>
<body>
    <div class="navbar">
        <div class="navbar-brand">QuickSlot</div>
        <div class="navbar-links">
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">Meeting Rooms</a></li>
                <li><a href="#">About Us</a></li>
                <li><a href="#">Contact Us</a></li>
                <li><a href="Login.html">Login/Register</a></li>
            </ul>
        </div>
    </div>

    <section class="hero">
        <div class="hero-content">
            <h1 class="hero-title">Discover the Perfect Space for Your Meetings</h1>
            <p class="hero-subtitle">Experience luxury and convenience with seamless meeting room bookings, tailored to your needs.</p>
            <a href="#" class="cta-button">Find Your Room</a>
        </div>
    </section>

    <script>
        // No JavaScript needed for basic navigation in this example.
        // The link in the navbar will handle the redirection.

</html>
