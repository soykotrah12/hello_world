<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickSlot Login</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 0;
            background: linear-gradient(to right, #e0f2f7, #f3e5f5); /* Light blue to light purple gradient */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .navbar {
            background-color: #0d47a1; /* Dark blue */
            color: white;
            padding: 15px 0;
            width: 100%;
            position: absolute;
            top: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-left: 20px;
            padding-right: 20px;
        }

        .navbar-brand {
            font-size: 1.5em;
            font-weight: bold;
        }

        .navbar-links ul {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
        }

        .navbar-links li {
            margin-left: 20px;
        }

        .navbar-links a {
            color: white;
            text-decoration: none;
        }

        .login-container {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .login-heading {
            font-size: 2em;
            margin-bottom: 20px;
            color: #333;
        }

        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-size: 0.9em;
        }

        .form-control {
            width: calc(100% - 22px);
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 1em;
        }

        .login-button {
            background-color: #1976d2; /* Blue */
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
            width: 100%;
        }

        .login-button:hover {
            background-color: #1565c0;
        }

        .signup-link {
            margin-top: 15px;
            font-size: 0.9em;
            color: #777;
        }

        .signup-link a {
            color: #1976d2;
            text-decoration: none;
            font-weight: bold;
        }

        .login-icon {
            font-size: 1.5em;
            color: #777;
            margin-left: 10px;
        }
    </style>
</head>
<body>
    <div class="navbar">
        <div class="navbar-brand">QuickSlot</div>
        <div class="navbar-links">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="#">Meeting Rooms</a></li>
                <li><a href="#">About Us</a></li>
                <li><a href="#">Contact Us</a></li>
                <li><a href="">Login/Register</a></li>
            </ul>
        </div>
    </div>

    <div class="login-container">
        <h2 class="login-heading">Login <span class="login-icon">&#128100;</span></h2>
        <form>
            <div class="form-group">
                <label for="email">Your Email</label>
                <input type="email" id="email" class="form-control" placeholder="Your Email">
            </div>
            <div class="form-group">
                <label for="password">Your Password</label>
                <input type="password" id="password" class="form-control" placeholder="Your Password">
            </div>
            <button type="submit" class="login-button">Login</button>
        </form>
        <div class="signup-link">
            Don't have an account? <a href="#">Sign Up</a>
        </div>
    </div>
</body>
</html>
